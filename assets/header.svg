    </text>
    <text x="450" y="195" font-size="18" fill="#fff" letter-spacing="3">Developer · Designer · Operational Leader</text>
    <rect y="115" width="3" height="52" fill="#fff" x="190"><animate attributeName="x" values="0;35;69;104;139;173;208;243;277;312;347;381;416;451;485;520;520" keyTimes="0.0;0.027;0.053;0.08;0.107;0.133;0.16;0.187;0.213;0.24;0.267;0.293;0.32;0.347;0.373;0.4;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
