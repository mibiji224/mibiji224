    <rect y="115" width="3" height="52" fill="#D6336C" x="210.0"><animate attributeName="x" values="210.0;258.2;291.2;320.8;341.2;371.3;404.3;437.4;452.0;489.5;526.2;556.3;593.0;632.9;653.3;690.0;690.0" keyTimes="0.0;0.0267;0.0533;0.08;0.1067;0.1333;0.16;0.1867;0.2133;0.24;0.2667;0.2933;0.32;0.3467;0.3733;0.4;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
