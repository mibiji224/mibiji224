<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Desiree Soronio - Developer, Designer, Operational Leader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE4EE"/><stop offset="1" stop-color="#DDF5E7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6336C"><animate attributeName="stop-color" values="#D6336C;#2F9E6E;#D6336C" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2F9E6E"><animate attributeName="stop-color" values="#2F9E6E;#D6336C;#2F9E6E" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="type"><rect x="190" y="105" height="75" width="0"><animate attributeName="width" values="0;35;69;104;139;173;208;243;277;312;347;381;416;451;485;520;520" keyTimes="0.0;0.027;0.053;0.08;0.107;0.133;0.16;0.187;0.213;0.24;0.267;0.293;0.32;0.347;0.373;0.4;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="frame"><rect x="6" y="6" width="888" height="288" rx="28"/></clipPath>
  </defs>
  <rect x="6" y="6" width="888" height="288" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <path d="M0 170.0 q112.5 -40.0 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V300.0 H0 Z" fill="#FFB3CF" opacity=".75"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/></path>
    <path d="M0 190.0 q112.5 -34.0 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V300.0 H0 Z" fill="#9ADDB6" opacity=".75"><animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="12s" repeatCount="indefinite"/></path>
    <path d="M0 210.0 q112.5 -28.0 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V300.0 H0 Z" fill="#FF8FB8" opacity=".6"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="7s" repeatCount="indefinite"/></path>
    <path d="M0 245.0 q112.5 -22.0 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V300.0 H0 Z" fill="#5BB98C" opacity=".55"><animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="10s" repeatCount="indefinite"/></path>
  </g>
  <rect x="6" y="6" width="888" height="288" rx="28" fill="none" stroke="#FF8FB8" stroke-width="4" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="14" width="872" height="272" rx="22" fill="none" stroke="#5BB98C" stroke-width="2" opacity=".7"/>
  <g font-family="Georgia, 'Trebuchet MS', serif" text-anchor="middle">
    <text x="450" y="105" font-size="22" fill="#2F6F55" letter-spacing="6">
      ✿ hi there, i'm ✿
      <animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="160" font-size="54" font-weight="bold" fill="url(#title)" clip-path="url(#type)">
      Desiree Soronio
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="195" font-size="18" fill="#B02A5B" letter-spacing="3">Developer ♡ Designer ♡ Operational Leader</text>
    <rect y="115" width="3" height="52" fill="#D6336C" x="190"><animate attributeName="x" values="0;35;69;104;139;173;208;243;277;312;347;381;416;451;485;520;520" keyTimes="0.0;0.027;0.053;0.08;0.107;0.133;0.16;0.187;0.213;0.24;0.267;0.293;0.32;0.347;0.373;0.4;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
  </g>
  <g font-size="22">
    <text x="90" y="70" fill="#FF8FB8">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="800" y="85" fill="#5BB98C">✦<animate attributeName="opacity" values="0;1;0" dur="3s" begin=".6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3s" begin=".6s" repeatCount="indefinite"/></text>
    <text x="175" y="125" fill="#5BB98C" font-size="16">♥<animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2.8s" begin="1s" repeatCount="indefinite"/></text>
    <text x="720" y="50" fill="#FF8FB8" font-size="18">♥<animate attributeName="opacity" values="0;1;0" dur="2.6s" begin=".3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2.6s" begin=".3s" repeatCount="indefinite"/></text>
    <text x="650" y="130" fill="#FF8FB8" font-size="14">✦<animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></text>
    <text x="260" y="60" fill="#5BB98C" font-size="14">✿<animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></text>
