    <clipPath id="type"><rect x="190" y="105" height="75" width="0"><animate attributeName="width" values="0;35;69;104;139;173;208;243;277;312;347;381;416;451;485;520;520" keyTimes="0.0;0.027;0.053;0.08;0.107;0.133;0.16;0.187;0.213;0.24;0.267;0.293;0.32;0.347;0.373;0.4;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="frame"><rect x="6" y="6" width="888" height="288" rx="28"/></clipPath>
  </defs>
  <rect x="6" y="6" width="888" height="288" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <path d="M0 170.0 q112.5 -40.0 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V300.0 H0 Z" fill="#B02A5B" opacity=".35"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/></path>
    <path d="M0 210.0 q112.5 -28.0 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V300.0 H0 Z" fill="#8E1F48" opacity=".3"><animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="7s" repeatCount="indefinite"/></path>
  </g>
  <rect x="6" y="6" width="888" height="288" rx="28" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="14" width="872" height="272" rx="22" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
